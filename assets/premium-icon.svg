<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Deep dark background radial -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0f1225"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>

    <!-- Purple glow for the star -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#c4b5fd" stop-opacity="1"/>
      <stop offset="60%"  stop-color="#8b7eff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6d5ad0" stop-opacity="0.7"/>
    </radialGradient>

    <!-- Soft outer bloom filter -->
    <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur"/>
      <feComposite  in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Tight inner glow on the star body -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="glow"/>
      <feComposite  in="SourceGraphic" in2="glow" operator="over"/>
    </filter>

    <!-- Subtle cyan ring accent -->
    <radialGradient id="ringGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#5ed9c9" stop-opacity="0"/>
      <stop offset="85%"  stop-color="#5ed9c9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5ed9c9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ── Background ─────────────────────────────────────── -->
  <rect width="1024" height="1024" rx="200" fill="url(#bgGrad)"/>

  <!-- ── Outer cyan ring halo ───────────────────────────── -->
  <circle cx="512" cy="512" r="340" fill="none"
          stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- ── Purple bloom behind the star ──────────────────── -->
  <circle cx="512" cy="512" r="200" fill="#8b7eff" opacity="0.08" filter="url(#bloom)"/>

  <!-- ── 4-pointed star (star-four-points) via polygon ─── -->
  <!--
      A 4-pointed star built as two overlapping thin rhombuses (X & Y).
      Each point extends 190 px from centre; waist is 30 px wide.
  -->
  <g filter="url(#coreGlow)">
    <!-- Vertical spike -->
    <polygon
      points="512,322  542,512  512,702  482,512"
      fill="url(#starGlow)"
    />
    <!-- Horizontal spike -->
    <polygon
      points="322,512  512,482  702,512  512,542"
      fill="url(#starGlow)"
    />
    <!-- Bright centre core -->
    <circle cx="512" cy="512" r="28" fill="#e8e0ff" opacity="0.95"/>
  </g>

  <!-- ── Subtle dot grid (3×3) below for depth ─────────── -->
  <g opacity="0.12" fill="#8b7eff">
    <!-- Row 1 -->
    <circle cx="360" cy="740" r="4"/>
    <circle cx="512" cy="740" r="4"/>
    <circle cx="664" cy="740" r="4"/>
    <!-- Row 2 -->
    <circle cx="360" cy="770" r="3"/>
    <circle cx="512" cy="770" r="3"/>
    <circle cx="664" cy="770" r="3"/>
  </g>
</svg>
