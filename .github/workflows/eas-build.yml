name: EAS Build (Android)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile (development, preview, production)
        required: true
        default: preview
      platform:
        description: Build platform
        required: true
        default: android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Run EAS build
        run: npx eas build --profile ${{ inputs.profile }} -p ${{ inputs.platform }} --non-interactive
